#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "moodle"
name = "Moodle"
description.en = "Online learning platform"
description.fr = "Plateforme d'apprentissage en ligne"

version = "5.1.6~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-or-later"
website = "https://moodle.org/"
demo = "https://sandbox.moodledemo.net/"
admindoc = "https://docs.moodle.org/400/en/Main_page"
code = "https://github.com/moodle/moodle"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = true

disk = "50M"
ram.build = "2000M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/moodle"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.site_name]
    ask.en = "Choose a name for the site you want to create"
    ask.fr = "Choisissez un nom pour le site que vous voulez créer"
    type = "string"
    default = "Moodle"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/moodle/moodle/archive/refs/tags/v5.1.6.tar.gz"
    sha256 = "e816b21ee28c8d2268051c819da4a24e08409551c63199fccea41571f6ea08ef"
    autoupdate.strategy = "latest_github_tag"
    autoupdate.version_regex = "^v(\\d+\\.\\d+\\.\\d+)$"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.3-mbstring, php8.3-curl, php8.3-xmlrpc, php8.3-soap, php8.3-zip, php8.3-gd, php8.3-xml, php8.3-intl, php8.3-mysql, php8.3-ldap"
    # PostgreSQL is no longer the database backend (the package now uses MariaDB).
    # It is only (re)installed transiently on servers still holding a legacy
    # PostgreSQL database, so that scripts/upgrade can read it and transfer the
    # data to MariaDB. Once the migration has run and the old PostgreSQL database
    # has been dropped, the next upgrade no longer lists these packages and APT
    # autoremoves them. Fresh installs never pull PostgreSQL in.
    packages_from_raw_bash = """
if command -v psql >/dev/null 2>&1; then
    legacy_db_name="${db_name:-$(echo "$app" | tr '.-' '__')}"
    if sudo --login --user=postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='${legacy_db_name}'" 2>/dev/null | grep -q 1; then
        echo "postgresql"
        echo "php8.3-pgsql"
    fi
fi
"""

    [resources.database]
    # Changing the type from "postgresql" to "mysql" (MariaDB) is applied as a
    # resource "update", not a "deprovision": YunoHost provisions the new MariaDB
    # database but never drops the existing PostgreSQL one. The actual data move
    # is handled explicitly by scripts/upgrade (see the migration block).
    type = "mysql"
