#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "moodle"
name = "Moodle"
description.en = "Online learning platform"
description.fr = "Plateforme d'apprentissage en ligne"

version = "5.2.2~ynh5"

maintainers = []

[upstream]
license = "GPL-3.0-or-later"
website = "https://moodle.org/"
demo = "https://sandbox.moodledemo.net/"
admindoc = "https://docs.moodle.org/400/en/Main_page"
code = "https://github.com/moodle/moodle"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = true

disk = "800M"
ram.build = "2000M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/moodle"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.site_name]
    ask.en = "Choose a name for the site you want to create"
    ask.fr = "Choisissez un nom pour le site que vous voulez créer"
    type = "string"
    default = "Moodle"

[resources]

    [resources.sources]

    [resources.sources.main]
    # Tracking the Moodle 5.2 stable WEEKLY build (MOODLE_502_STABLE, Build:
    # 20260818) rather than the v5.2.2 tag, to pick up ~4 months of 5.2 security
    # and bug fixes released after the tag. Pinned to a specific commit tarball
    # (reproducible) instead of the moving branch ref, so the sha256 stays valid.
    #
    # Autoupdate is intentionally DISABLED while we track the branch: the
    # latest_github_tag strategy would pull us back to the v5.2.2 tag (older than
    # this build) or forward to a 5.3 tag (which needs MariaDB 11.4 / Debian 13).
    # TO RETURN TO TAGGED RELEASES once Moodle publishes the next 5.2 point
    # release (v5.2.3): set version to "5.2.3~ynh1", point url back at
    # refs/tags/v5.2.3.tar.gz with its sha256, and uncomment the two autoupdate
    # lines below. To advance the weekly in the meantime, repoint url/sha256 at a
    # newer MOODLE_502_STABLE commit and bump the ~ynhN revision.
    url = "https://github.com/moodle/moodle/archive/b07dd04b40ece3b2d43b2e6ec1213db2a997df7f.tar.gz"
    sha256 = "f2e44ed4ec12857bd42249f6baca6a8950655fd1c4ac7bef8b5a81db72ae2295"
    # autoupdate.strategy = "latest_github_tag"
    # autoupdate.version_regex = "^v(\\d+\\.\\d+\\.\\d+)$"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.3-mbstring, php8.3-curl, php8.3-xmlrpc, php8.3-soap, php8.3-zip, php8.3-gd, php8.3-xml, php8.3-intl, php8.3-mysql, php8.3-ldap"
    # PostgreSQL is no longer the database backend (the package now uses MariaDB).
    # It is only (re)installed transiently on servers still holding a legacy
    # PostgreSQL database, so that scripts/upgrade can read it and transfer the
    # data to MariaDB. Once the migration has run and the old PostgreSQL database
    # has been dropped, the next upgrade no longer lists these packages and APT
    # autoremoves them. Fresh installs never pull PostgreSQL in.
    packages_from_raw_bash = """
if command -v psql >/dev/null 2>&1; then
    legacy_db_name="${db_name:-$(echo "$app" | tr '.-' '__')}"
    if sudo --login --user=postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='${legacy_db_name}'" 2>/dev/null | grep -q 1; then
        echo "postgresql"
        echo "php8.3-pgsql"
    fi
fi
"""

    [resources.database]
    # Changing the type from "postgresql" to "mysql" (MariaDB) is applied as a
    # resource "update", not a "deprovision": YunoHost provisions the new MariaDB
    # database but never drops the existing PostgreSQL one. The actual data move
    # is handled explicitly by scripts/upgrade (see the migration block).
    type = "mysql"
